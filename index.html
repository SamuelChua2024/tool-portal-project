<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Tools Portal</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"><a href="index.html">Python Tools Portal</a></h1>
    <button type="button" id="theme-toggle" aria-pressed="false">Switch to dark theme</button>
  </header>

  <main>
    <p>Small web tools to help you learn Python. Pick a tool to try it.</p>

    <ul class="card-grid">
      <!-- To add a new tool: create tools/<tool-name>/index.html and add one <li> card like this one. -->
      <li>
        <a class="card" href="tools/code-explainer/index.html">
          <h2>Python Code Explainer</h2>
          <p>Paste Python code and get a plain-language explanation of each line.</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
